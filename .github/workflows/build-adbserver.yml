name: Build ADBServer APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-adbserver.yml'
      - 'ADBServer/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (ADBServer app source)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout adb source (prife/adb)
        uses: actions/checkout@v4
        with:
          repository: prife/adb
          path: n-adb

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make git

      - name: Locate NDK
        id: ndk
        run: |
          # GitHub 的 ubuntu-latest 镜像自带 Android SDK/NDK
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d | sort -V | tail -n1)
          fi
          echo "NDK path: $NDK_PATH"
          echo "ndk_path=$NDK_PATH" >> "$GITHUB_OUTPUT"

      - name: Fetch boringssl (adb's crypto dep)
        working-directory: n-adb/lib
        run: |
          git clone https://salsa.debian.org/android-tools-team/android-platform-external-boringssl.git boringssl
          cd boringssl
          git checkout debian/8.1.0+r23-3

      - name: Build boringssl (NDK, android-arm64)
        working-directory: n-adb/lib/boringssl
        env:
          TOOLCHAIN_BIN: ${{ steps.ndk.outputs.ndk_path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          make CFLAGS=-fPIC CC="$TOOLCHAIN_BIN/aarch64-linux-android24-clang" -f debian/libcrypto.mk
          make CXXFLAGS=-fPIC CXX="$TOOLCHAIN_BIN/aarch64-linux-android24-clang++" -f debian/libssl.mk

      - name: Configure & build adb (NDK, android-arm64)
        working-directory: n-adb
        run: |
          mkdir build-android
          cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk_path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          make -j"$(nproc)"

      - name: Locate built adb binary and rename for jniLibs
        run: |
          BIN=$(find n-adb/build-android -maxdepth 1 -type f -executable -iname 'adb*' | head -n1)
          echo "found: $BIN"
          file "$BIN"
          mkdir -p repo/ADBServer/app/src/main/jniLibs/arm64-v8a
          cp "$BIN" repo/ADBServer/app/src/main/jniLibs/arm64-v8a/libadb.so

      - name: Assemble debug APK
        working-directory: repo/ADBServer
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADBServer-debug-apk
          path: repo/ADBServer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
