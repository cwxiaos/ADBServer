name: Build adb binary only (no APK)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-adb-test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adb source (prife/adb)
        uses: actions/checkout@v4
        with:
          repository: prife/adb
          path: n-adb

      # - name: Install build deps
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y cmake make git

      - name: Locate NDK
        id: ndk
        run: |
          # GitHub 的 ubuntu-latest 镜像自带 Android SDK/NDK
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -type d | sort -V | tail -n1)
          fi
          echo "NDK path: $NDK_PATH"
          echo "ndk_path=$NDK_PATH" >> "$GITHUB_OUTPUT"

      - name: Fetch boringssl (adb's crypto dep)
        working-directory: n-adb/lib
        run: |
          git clone https://salsa.debian.org/android-tools-team/android-platform-external-boringssl.git boringssl
          cd boringssl
          git checkout debian/8.1.0+r23-3

      - name: Build boringssl (NDK, android-arm64, static archive)
        working-directory: n-adb/lib/boringssl
        env:
          TOOLCHAIN_BIN: ${{ steps.ndk.outputs.ndk_path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          # 预生成的 ARM64 汇编文件（sha256-armv8.S 等）访问
          # OPENSSL_armcap_P 用的重定位类型（R_AARCH64_PREL64）不满足
          # 共享库（.so）要求的 GOT 间接寻址，链接成 .so 会直接报错。
          # 改成编译成静态归档（.a），静态链接进最终的 adb 可执行文件，
          # 没有 DSO 边界，这类重定位完全合法，问题不复存在。
          #
          # 用 $(info) 让 make 把展开好的 SOURCES 变量打印出来，
          # 而不是去改 Makefile 的 recipe——Make 对 recipe 的 tab
          # 缩进极其敏感，在 workflow yaml 里手写 heredoc 很容易踩坑，
          # 直接用 bash 循环编译更稳。
          CC="$TOOLCHAIN_BIN/aarch64-linux-android30-clang"
          CXX="$TOOLCHAIN_BIN/aarch64-linux-android30-clang++"
          AR="$TOOLCHAIN_BIN/llvm-ar"
          CFLAGS="-fPIC -march=armv8-a+crypto -D_XOPEN_SOURCE=700 -DBORINGSSL_ANDROID_SYSTEM -DBORINGSSL_IMPLEMENTATION -DBORINGSSL_SHARED_LIBRARY -DOPENSSL_SMALL -fvisibility=hidden -Wa,--noexecstack"

          mkdir -p debian/out debian/objs

          echo '' >> debian/libcrypto.mk
          echo '$(info SOURCES_LIST:$(SOURCES))' >> debian/libcrypto.mk
          CRYPTO_SOURCES=$(make -f debian/libcrypto.mk DEB_HOST_ARCH=arm64 print-nothing 2>&1 \
              | grep '^SOURCES_LIST:' | sed 's/^SOURCES_LIST://')
          echo "crypto source count: $(echo $CRYPTO_SOURCES | wc -w)"
          for f in $CRYPTO_SOURCES; do
            obj="debian/objs/$(echo "$f" | tr '/' '_').o"
            "$CC" $CFLAGS -Isrc/include -Isrc/crypto -c "$f" -o "$obj"
          done
          "$AR" rcs debian/out/libcrypto.a debian/objs/*.o
          rm -f debian/objs/*.o

          echo '' >> debian/libssl.mk
          echo '$(info SOURCES_LIST:$(SOURCES))' >> debian/libssl.mk
          SSL_SOURCES=$(make -f debian/libssl.mk DEB_HOST_ARCH=arm64 print-nothing 2>&1 \
              | grep '^SOURCES_LIST:' | sed 's/^SOURCES_LIST://')
          echo "ssl source count: $(echo $SSL_SOURCES | wc -w)"
          for f in $SSL_SOURCES; do
            obj="debian/objs/$(echo "$f" | tr '/' '_').o"
            "$CXX" $CFLAGS -Isrc/include -c "$f" -o "$obj"
          done
          "$AR" rcs debian/out/libssl.a debian/objs/*.o

          ls -la debian/out/

      - name: Patch adb's CMakeLists.txt (also hardcodes pthread/rt, and a bad prebuilt libcrypto)
        run: |
          # src/CMakeLists.txt 的 LINK_LIBS 列表里写死了 pthread 和 rt，
          # 这是 CMake target_link_libraries，不是 Makefile 变量，
          # 没法用命令行覆盖，直接 sed 去掉。
          #
          # rt 这条尤其坑：触发条件是 CMAKE_HOST_SYSTEM_NAME MATCHES
          # "Linux"——判断的是"在什么系统上编译"而不是"编译给什么系统
          # 用"。我们在 Linux 上交叉编译到 Android，宿主机确实是
          # Linux，这个分支被误触发，加上了桌面 Linux 才需要的 -lrt
          # （bionic 没有独立 librt，实时扩展函数早并进 libc 了）。
          sed -i 's/ pthread)/)/' n-adb/src/CMakeLists.txt
          sed -i 's/set(LINK_LIBS ${LINK_LIBS} rt)/set(LINK_LIBS ${LINK_LIBS})/' n-adb/src/CMakeLists.txt

          # 同样的坑：CMAKE_SYSTEM_PROCESSOR MATCHES "aarch64" 这条分支
          # 本来是给"在 ARM64 Linux 主机上自己编译 adb"（比如树莓派）
          # 这个场景用的，里面链接的是仓库自带、预编译好的 glibc 版
          # libcrypto.a（没加 -fPIC）。Android target 同样是 aarch64，
          # 误命中了这个分支，链接进了不兼容的库。改成指向我们自己
          # 刚编译出来、正确带 -fPIC 的 boringssl 产物目录。
          sed -i 's#link_directories(${CMAKE_SOURCE_DIR}/prebuilt/linux/aarch64)#link_directories(${CMAKE_SOURCE_DIR}/lib/boringssl/debian/out)#' n-adb/src/CMakeLists.txt

          grep -n "LINK_LIBS\|link_directories" n-adb/src/CMakeLists.txt

      - name: Patch adb_trace.h (drop unused utils/Trace.h include)
        run: |
          # adb_trace.h 同时 include 了 cutils/trace.h 和 utils/Trace.h，
          # 但 adb 源码里实际只用了 cutils/trace.h 提供的 ATRACE_* 宏
          # （已完整 vendor 在仓库里，自包含）。utils/Trace.h 是
          # AOSP libutils 里那个没人用的 android::Tracer 类，它会一路
          # include 到 system/graphics.h，而这个头文件 prife/adb 压根
          # 没有 vendor 进来，所以直接删掉这行没用的 include。
          sed -i '/#include <utils\/Trace.h>/d' n-adb/src/adb_trace.h
          grep -n "trace.h\|Trace.h" n-adb/src/adb_trace.h

      - name: Configure & build adb (NDK, android-arm64)
        working-directory: n-adb
        run: |
          mkdir build-android
          cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk_path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-D_FORTIFY_SOURCE=0" \
            -DCMAKE_CXX_FLAGS="-D_FORTIFY_SOURCE=0"
          make -j"$(nproc)"

      - name: Locate built adb binary
        run: |
          BIN=$(find n-adb/build-android -type f -executable -iname 'adb' | head -n1)
          echo "found: $BIN"

          "$TOOLCHAIN_BIN/llvm-strip" "$BIN"
          
          file "$BIN"
          mkdir -p out
          cp "$BIN" out/adb-android-arm64
          ls -la out/

      - name: Upload adb binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-android-arm64
          path: out/adb-android-arm64
          if-no-files-found: error